<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sajian! — Warung Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #241408; }
  body { display: grid; place-items: center; overflow: hidden; }
  #game {
    width: min(100vw, 160vh);
    aspect-ratio: 8 / 5;
    height: auto;
    display: block;
    touch-action: none;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Sajian! Warung Rush: cook to order — take tickets, chop, grill, plate and serve before patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
